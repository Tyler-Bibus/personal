<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- PCB-style grid background -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="50" y1="0" x2="50" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="250" y1="0" x2="250" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>
  <line x1="350" y1="0" x2="350" y2="300" stroke="#dc143c" stroke-width="0.3" opacity="0.15"/>

  <!-- Central chip -->
  <rect x="140" y="85" width="120" height="120" rx="8" fill="#2d2d4e" stroke="#dc143c" stroke-width="3"/>
  <!-- Chip inner die -->
  <rect x="158" y="103" width="84" height="84" rx="4" fill="#1a1a2e" stroke="#dc143c" stroke-width="1.5" opacity="0.8"/>

  <!-- Neural network nodes inside chip -->
  <circle cx="185" cy="125" r="7" fill="#dc143c" opacity="0.9"/>
  <circle cx="215" cy="125" r="7" fill="#dc143c" opacity="0.9"/>
  <circle cx="200" cy="150" r="8" fill="#dc143c"/>
  <circle cx="185" cy="175" r="7" fill="#dc143c" opacity="0.9"/>
  <circle cx="215" cy="175" r="7" fill="#dc143c" opacity="0.9"/>
  <!-- connections -->
  <line x1="185" y1="125" x2="200" y2="150" stroke="#dc143c" stroke-width="1.5" opacity="0.6"/>
  <line x1="215" y1="125" x2="200" y2="150" stroke="#dc143c" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="150" x2="185" y2="175" stroke="#dc143c" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="150" x2="215" y2="175" stroke="#dc143c" stroke-width="1.5" opacity="0.6"/>
  <line x1="185" y1="125" x2="215" y2="175" stroke="#dc143c" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="125" x2="185" y2="175" stroke="#dc143c" stroke-width="1" opacity="0.3"/>

  <!-- Left pins -->
  <rect x="108" y="100" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="115" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="130" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="145" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="160" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="175" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="108" y="190" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Right pins -->
  <rect x="260" y="100" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="115" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="130" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="145" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="160" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="175" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="260" y="190" width="32" height="5" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Top pins -->
  <rect x="152" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="167" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="182" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="197" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="212" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="227" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="242" y="53" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Bottom pins -->
  <rect x="152" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="167" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="182" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="197" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="212" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="227" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="242" y="215" width="5" height="32" rx="2" fill="#dc143c" opacity="0.7"/>

  <text x="200" y="280" font-family="Arial, sans-serif" font-size="13" fill="#dc143c" opacity="0.6" text-anchor="middle" font-weight="bold">ML Hardware Accelerator</text>
</svg>
