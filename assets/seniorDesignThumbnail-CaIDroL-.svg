<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Wireless signal arcs (left side) -->
  <path d="M 148 150 A 30 30 0 0 1 148 150" fill="none"/>
  <path d="M 132 130 A 28 28 0 0 1 132 170" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 115 112 A 52 52 0 0 1 115 188" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M 98 94" fill="none"/>
  <path d="M 98 94 A 76 76 0 0 1 98 206" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 80 75 A 102 102 0 0 1 80 225" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Wireless signal arcs (right side) -->
  <path d="M 268 130 A 28 28 0 0 0 268 170" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 285 112 A 52 52 0 0 0 285 188" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M 302 94 A 76 76 0 0 0 302 206" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 320 75 A 102 102 0 0 0 320 225" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Central microchip -->
  <rect x="155" y="100" width="90" height="100" rx="8" fill="#2d2d4e" stroke="#dc143c" stroke-width="2.5"/>
  <rect x="168" y="113" width="64" height="74" rx="4" fill="#1a1a2e" stroke="#dc143c" stroke-width="1.5" opacity="0.8"/>

  <!-- Bluetooth symbol inside chip -->
  <!-- Bluetooth: vertical line + two right-pointing chevrons mirrored -->
  <line x1="200" y1="128" x2="200" y2="186" stroke="#dc143c" stroke-width="3"/>
  <line x1="200" y1="128" x2="216" y2="140" stroke="#dc143c" stroke-width="3"/>
  <line x1="216" y1="140" x2="200" y2="157" stroke="#dc143c" stroke-width="3"/>
  <line x1="200" y1="157" x2="216" y2="174" stroke="#dc143c" stroke-width="3"/>
  <line x1="216" y1="174" x2="200" y2="186" stroke="#dc143c" stroke-width="3"/>
  <!-- Left side mirror lines to complete B shape -->
  <line x1="200" y1="128" x2="184" y2="140" stroke="#dc143c" stroke-width="1.5" opacity="0.35"/>
  <line x1="200" y1="186" x2="184" y2="174" stroke="#dc143c" stroke-width="1.5" opacity="0.35"/>

  <!-- Chip pins left -->
  <rect x="133" y="115" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="133" y="130" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="133" y="145" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="133" y="160" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="133" y="175" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Chip pins right -->
  <rect x="245" y="115" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="245" y="130" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="245" y="145" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="245" y="160" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="245" y="175" width="22" height="5" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Chip pins top -->
  <rect x="168" y="78" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="183" y="78" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="198" y="78" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="213" y="78" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="228" y="78" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>

  <!-- Chip pins bottom -->
  <rect x="168" y="200" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="183" y="200" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="198" y="200" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="213" y="200" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>
  <rect x="228" y="200" width="5" height="22" rx="2" fill="#dc143c" opacity="0.7"/>

  <text x="200" y="278" font-family="Arial, sans-serif" font-size="13" fill="#dc143c" opacity="0.6" text-anchor="middle" font-weight="bold">Bluetooth ASIC</text>
</svg>
